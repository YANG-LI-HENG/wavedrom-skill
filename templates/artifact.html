<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.5.0/skins/default.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.5.0/wavedrom.min.js"></script>
<style>
  /* Layout: one column, the waveform on a white "scope screen" card, cycle notes below in mono. */
  :root {
    --bg: #f3f5f8;
    --ink: #1b2330;
    --muted: #5d6878;
    --rule: #d5dbe4;
    --card: #ffffff;        /* WaveDrom draws black on white: the card stays white in both themes */
    --accent: #1f4fb8;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --ink: #e4e9f0; --muted: #98a3b3; --rule: #2a323e; --accent: #8fb0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d; --ink: #e4e9f0; --muted: #98a3b3; --rule: #2a323e; --accent: #8fb0ff;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; text-wrap: balance; }
  .scope {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
  }
  .scope svg { display: block; max-width: none; }
  .notes {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.85rem;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--ink);
    max-width: 75ch;
  }
  .notes:empty { display: none; }
  .foot { font-size: 0.8rem; color: var(--muted); }
  .foot a { color: var(--accent); }
  .foot a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: #b3261e; font-family: var(--mono); font-size: 0.85rem; }
</style>

<main>
  <h1>__TITLE__</h1>
  <div class="scope" id="scope">
    <script type="WaveDrom">__WAVEJSON__</script>
  </div>
  <pre class="notes">__CAPTION__</pre>
  <div class="foot">Ticks mark rising clock edges; cycle N is the column between ticks N and N+1. <a href="__EDITOR_URL__" target="_blank" rel="noopener">Open in WaveDrom editor</a></div>
</main>

<script>
  function draw() {
    if (window.WaveDrom) {
      WaveDrom.ProcessAll();
    } else {
      document.getElementById('scope').innerHTML =
        '<p class="error">WaveDrom could not load. Use the editor link below to view the diagram.</p>';
    }
  }
  if (document.readyState === 'complete') draw(); else window.addEventListener('load', draw);
</script>
